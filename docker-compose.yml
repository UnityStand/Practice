# Вся система: PostgreSQL, Kafka, Redis, три сервиса и мониторинг (Prometheus, Jaeger, Grafana).
# Запуск из корня репозитория:  docker compose up --build -d
# Только инфраструктура (для dotnet run):  docker compose up -d postgres kafka redis
# Остановка:  docker compose down        (данные БД сохраняются в томе eventapi_pgdata)

# Общие настройки JWT — одинаковые для всех сервисов, иначе токен Users не пройдёт проверку в Events/Bookings
x-jwt: &jwt
  Jwt__Secret: "zOVVagowBFTHUFGYuqXgbTzrTmVSVOlhgGtoKScoztyGA"
  Jwt__Issuer: "User"
  Jwt__Audience: "ApiClient"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventapi
    ports:
      - "5432:5432"
    volumes:
      - eventapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 29092 — для контейнеров (kafka:29092), 9092 — для dotnet run на хосте (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Топик создаёт сервис Events при старте (KafkaTopicInitializer)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    # Кеш без персистентности: после рестарта Redis пуст и не воскрешает ключи, устаревшие за время простоя
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"   # для dotnet run на хосте (localhost:6379)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  users:
    build:
      context: .
      dockerfile: src/Users/Users.Api/Dockerfile
    container_name: users-service
    ports:
      - "5001:8080"
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: Development   # Swagger включён только в Development
      Otlp__Endpoint: "http://jaeger:4317"   # внутри сети Docker Jaeger доступен по имени контейнера
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=user_db;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  events:
    build:
      context: .
      dockerfile: src/Events/Events.Api/Dockerfile
    container_name: events-service
    ports:
      - "5002:8080"
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: Development
      Otlp__Endpoint: "http://jaeger:4317"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=events_db;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Kafka__ConsumerGroup: "events-service"
      Redis__ConnectionString: "redis:6379"   # имя контейнера, а не localhost
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started   # Redis не обязателен для старта: без него кеш деградирует до промахов

  bookings:
    build:
      context: .
      dockerfile: src/Bookings/Bookings.Api/Dockerfile
    container_name: bookings-service
    ports:
      - "5003:8080"
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: Development
      Otlp__Endpoint: "http://jaeger:4317"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=booking_db;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"   # UI: http://localhost:9090

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"   # UI: http://localhost:16686
      - "4317:4317"     # OTLP gRPC — сюда сервисы отправляют трейсы
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    ports:
      - "3000:3000"   # UI: http://localhost:3000 (admin / admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      # provisioning: datasource и дашборд подключаются из файлов, без ручной настройки в UI
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  eventapi_pgdata:
  grafana-data:
